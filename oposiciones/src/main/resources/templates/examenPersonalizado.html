<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Examen personalizado</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-5">

    <h1 class="fw-bold mb-5">
        Examen personalizado
    </h1>

    <form th:action="@{/personalizado/corregir}"
          method="post">

        <div th:each="pregunta,iter : ${preguntas}"
             class="card shadow-sm p-4 mb-4">

            <h5 class="mb-4">

                <span th:text="${iter.index + 1}">
                </span>.

                <span th:text="${pregunta.pregunta}">
                </span>

            </h5>

            <!-- OPCIÓN 1 -->

            <div class="form-check mb-2">

                <input type="radio"
                       class="form-check-input"
                       th:name="'pregunta_' + ${pregunta.idPregunta}"
                       value="1">

                <label class="form-check-label"
                       th:text="${pregunta.opcion1}">
                </label>

            </div>

            <!-- OPCIÓN 2 -->

            <div class="form-check mb-2">

                <input type="radio"
                       class="form-check-input"
                       th:name="'pregunta_' + ${pregunta.idPregunta}"
                       value="2">

                <label class="form-check-label"
                       th:text="${pregunta.opcion2}">
                </label>

            </div>

            <!-- OPCIÓN 3 -->

            <div class="form-check mb-2">

                <input type="radio"
                       class="form-check-input"
                       th:name="'pregunta_' + ${pregunta.idPregunta}"
                       value="3">

                <label class="form-check-label"
                       th:text="${pregunta.opcion3}">
                </label>

            </div>

            <!-- OPCIÓN 4 -->

            <div class="form-check">

                <input type="radio"
                       class="form-check-input"
                       th:name="'pregunta_' + ${pregunta.idPregunta}"
                       value="4">

                <label class="form-check-label"
                       th:text="${pregunta.opcion4}">
                </label>

            </div>

        </div>

        <button class="btn btn-primary btn-lg">
            Finalizar examen
        </button>

    </form>

</div>

</body>
</html>

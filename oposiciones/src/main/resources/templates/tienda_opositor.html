<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Productos de interés</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          crossorigin="anonymous">

    <style>
        .navbar,
        .navbar a,
        .navbar-brand,
        .nav-link {
            color: black !important;
        }

        .navbar a:hover,
        .navbar-brand:hover,
        .nav-link:hover {
            color: black !important;
        }

        body {
            background: #f8f9fa;
        }

        .page-wrapper {
            padding: 20px 30px 40px 30px;
        }

        h2 {
            margin: 20px 0;
            font-weight: 700;
        }

        .tabla-img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
        }

        .modal-img {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 16px;
        }

        .btn-primary {
            background: #1976d2;
            border: none;
        }

        .btn-primary:hover {
            background: #145ca1;
        }

        tbody tr {
            cursor: pointer;
        }

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg"
     style="background-color: #d9dbde;"
     data-bs-theme="dark">

    <div class="container-fluid">

        <a class="navbar-brand" href="#">
            <img src="img/logoAjustado.png"
                 alt="Logo"
                 class="d-inline-block"
                 style="width: 40px; height: auto;">
            Punto de corte
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse"
             id="navbarSupportedContent">

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link active"
                       th:href="@{/home}">
                        Inicio
                    </a>
                </li>

            </ul>

            <div class="me-3">
                Hola <span th:text="${usuario.nombre}"></span>
            </div>

            <form class="d-flex">
                <input class="form-control me-2"
                       type="search"
                       placeholder="Buscar"/>
                <button class="btn btn-outline-success"
                        type="submit">
                    Buscar
                </button>
            </form>

            <a th:href="@{/perfil}"
               class="btn btn-outline-primary ms-2 me-3"
               th:text="'Perfil de ' + ${usuario.nombre}">
            </a>

            <form th:action="@{/logout}"
                  method="post">
                <button class="btn btn-outline-danger">
                    Cerrar sesión
                </button>
            </form>

        </div>

    </div>

</nav>

<div class="page-wrapper">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Productos de interés</h2>

    </div>

    <!-- FILTROS -->

    <div class="d-flex gap-2 flex-wrap mb-4">

        <a th:href="@{/tiendaOpositor}"
           class="btn btn-sm"
           th:classappend="${categoriaActiva == null}
           ? ' btn-primary'
           : ' btn-outline-primary'">

            Todos

        </a>

        <a th:each="cat : ${ {'suplementos','ropa','accesorios','material'} }"
           th:href="@{/tiendaOpositor(categoria=${cat})}"
           th:text="${cat}"
           class="btn btn-sm"
           th:classappend="${categoriaActiva == cat}
           ? ' btn-primary'
           : ' btn-outline-primary'"
           style="text-transform: capitalize;">

        </a>

    </div>

    <!-- TABLA -->

    <div class="card shadow-sm">

        <div class="card-body p-0">

            <table class="table table-hover align-middle mb-0">

                <thead class="table-light">

                <tr>

                    <th>Imagen</th>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th>Precio</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="p : ${productos}"
                    th:data-id="${p.idProduc}"
                    th:data-nombre="${p.nombreProduc}"
                    th:data-descrip="${p.descripProduc}"
                    th:data-precio="${p.precio}"
                    th:data-categoria="${p.categoria}"
                    th:data-img="${p.urlProduc}"
                    onclick="abrirDetalle(this)">

                    <td>

                        <img th:src="${p.urlProduc}"
                             class="tabla-img"
                             onerror="this.src='/img/placeholder.png'">

                    </td>

                    <td th:text="${p.nombreProduc}"></td>

                    <td>

                        <span class="badge bg-secondary"
                              style="text-transform: capitalize;"
                              th:text="${p.categoria}">
                        </span>

                    </td>

                    <td th:text="${p.precio + ' €'}"></td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

    <div th:if="${#lists.isEmpty(productos)}"
         class="text-center text-muted py-5">

        <p>No hay productos disponibles.</p>

    </div>

</div>

<!-- MODAL -->

<div class="modal fade"
     id="modalDetalle"
     tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header border-0">

                <h5 class="modal-title fw-bold"
                    id="modal-nombre">
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <img id="modal-img"
                     src=""
                     class="modal-img"
                     onerror="this.src='/img/placeholder.png'">

                <div class="d-flex justify-content-between align-items-center mb-3">

                    <span class="badge bg-secondary"
                          id="modal-categoria"
                          style="text-transform: capitalize; font-size: 0.85rem;">
                    </span>

                    <strong class="text-primary fs-5"
                            id="modal-precio">
                    </strong>

                </div>

                <p class="text-muted"
                   id="modal-descrip">
                </p>

            </div>

            <div class="modal-footer border-0">

                <form id="form-carrito"
                      method="post">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}" />

                    <button type="submit"
                            class="btn btn-primary px-4">

                        🛒 Añadir al carrito

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>

<script>

    function abrirDetalle(fila) {

        document.getElementById("modal-nombre").textContent =
            fila.dataset.nombre;

        document.getElementById("modal-descrip").textContent =
            fila.dataset.descrip;

        document.getElementById("modal-precio").textContent =
            fila.dataset.precio + " €";

        document.getElementById("modal-categoria").textContent =
            fila.dataset.categoria;

        document.getElementById("modal-img").src =
            fila.dataset.img || "/img/placeholder.png";

        document.getElementById("form-carrito").action =
            "/carrito/anadir/" + fila.dataset.id;

        new bootstrap.Modal(
            document.getElementById("modalDetalle")
        ).show();
    }

</script>

</body>
</html>

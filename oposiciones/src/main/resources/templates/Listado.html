<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>Punto de corte</title>

    <link th:href="@{/css/cssinicial.css}"
          href="/css/cssinicial.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg"
     style="background-color: #d9dbde;"
     data-bs-theme="dark">

    <div class="container-fluid">

        <a class="navbar-brand" href="#">
            <img th:src="@{/img/logoAjustado.png}"
                 alt="Logo"
                 class="d-inline-block"
                 style="width: 40px; height: auto;">
            Punto de corte
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse"
             id="navbarSupportedContent">

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link active"
                       th:href="@{/home}">
                        Inicio
                    </a>
                </li>

            </ul>

            <div class="me-3">
                Hola <span th:text="${usuario.nombre}"></span>
            </div>

            <form class="d-flex" onsubmit="return false;">
                <input class="form-control me-2"
                       type="search"
                       placeholder="Buscar módulo..."
                       id="buscadorModulos"/>
                <button class="btn btn-outline-success"
                        type="submit">
                    Buscar
                </button>
            </form>

            <a th:href="@{/perfil}"
               class="btn btn-outline-primary ms-2 me-3"
                th:text="'Perfil de ' + ${usuario.nombre}">
            </a>

            <form th:action="@{/logout}"
                  method="post">
                <button class="btn btn-outline-danger">
                    Cerrar sesión
                </button>
            </form>

        </div>

    </div>

</nav>

<div class="container mt-4 func-estilo">

    <div class="row">
        <!-- Si no hay resultados -->
        <div id="sinResultados"
             class="text-center mt-4"
             style="display: none;">
            <h4>No se encontraron módulos</h4>
            <p class="text-muted">
                Prueba con otro término de búsqueda.
            </p>

        </div>

        <!-- Tarjetas dinámicas -->
        <div th:each="modulo : ${modulos}"
             class="col-md-3 mb-4 tarjeta-modulo">

            <div class="card" th:attr="data-nombre=${modulo.nombre}">

                <img th:src="@{${modulo.imagen}}"
                     class="card-img-top">

                <div class="card-body d-flex flex-column">

                    <h5 th:text="${modulo.nombre}"
                        class="card-title"></h5>

                    <p th:text="${modulo.descripcion}"
                       class="card-text"></p>

                    <div class="mt-auto pt-3">
                        <a class="btn btn-primary"
                           th:href="@{${modulo.ruta}}"
                           th:text="${modulo.textoBoton}"></a>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const buscador = document.getElementById("buscadorModulos");
    const mensajeSinResultados =
        document.getElementById("sinResultados");
    buscador.addEventListener("keyup", function () {
        const texto = buscador.value.toLowerCase();
        const tarjetas =
            document.querySelectorAll(".tarjeta-modulo");
        let visibles = 0;
        tarjetas.forEach(tarjeta => {
            const card = tarjeta.querySelector(".card");
            const nombreModulo =
                card.dataset.nombre.toLowerCase();
            if (nombreModulo.includes(texto)) {
                tarjeta.style.display = "block";
                visibles++;
            } else {
                tarjeta.style.display = "none";
            }
        });
        if (visibles === 0) {
            mensajeSinResultados.style.display = "block";
        } else {
            mensajeSinResultados.style.display = "none";
        }
    });
</script>
</body>
</html>

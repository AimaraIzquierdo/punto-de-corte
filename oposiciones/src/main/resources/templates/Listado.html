<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Punto de corte</title>

    <link th:href="@{/css/cssinicial.css}" href="/css/cssinicial.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg" style="background-color: #d9dbde;" data-bs-theme="dark">

    <div class="container-fluid">

        <a class="navbar-brand" href="#">
            <img src="img/logoAjustado.png"
                 alt="Logo"
                 class="d-inline-block"
                 style="width: 40px; height: auto;"
            >

            Punto de corte
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link active"
                       aria-current="page"
                       th:href="@{/}">
                        Inicio
                    </a>
                </li>

            </ul>

            <div class="me-3">
                Hola <span th:text="${usuario.nombre}"></span>
            </div>

            <form class="d-flex" role="search">


                <input class="form-control me-2"
                       type="search"
                       placeholder="Buscar"
                       aria-label="Search"/>

                <button class="btn btn-outline-success" type="submit">
                    Buscar
                </button>

            </form>

            <li class="nav-item">    <a class="nav-link" href="/perfil">Mi Perfil</a></li>

            <form th:action="@{/logout}" method="post">

                <button class="btn btn-outline-danger">
                    Cerrar sesión
                </button>

            </form>

        </div>

    </div>

</nav>

<div class="container mt-4 func-estilo">

    <div class="row">

        <div th:each="modulo : ${modulos}"
             class="col-md-3 mb-4">

            <div class="card">

                <img th:src="@{${modulo.imagen}}" class="card-img-top" alt="Imagen módulo">

                <div class="card-body">

                    <h5 th:text="${modulo.nombre}" class="card-title"></h5>

                    <p th:text="${modulo.descripcion}" class="card-text"></p>

                    <div class="card-footer text-muted">
                        <!-- Usar la ruta del módulo para navegar -->
                        <a class="btn btn-primary"
                           th:href="@{${modulo.ruta}}"
                           th:text="${modulo.textoBoton}"></a>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

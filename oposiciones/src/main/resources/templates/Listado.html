<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Punto de corte</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="css/cssinicial.css"
          rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary">

    <div class="container-fluid">

        <a class="navbar-brand" href="/">
            <img src="img/favicon_escudo.svg"
                 alt="Logo"
                 class="d-inline-block"
                 style="width: 40px; height: auto;">

            Punto de corte
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="navbarSupportedContent">

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link active"
                       href="/">
                        Inicio
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="/videos">
                        Videos
                    </a>
                </li>

                <li class="nav-item">
                    <a href="/flashcards"
                       class="btn btn-primary">
                        Ir a flashcards
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<div class="container mt-4 func-estilo">

    <div class="row">

        <div th:each="modulo : ${modulos}"
             class="col-md-3 mb-4">

            <div class="card">

                <img th:src="${modulo.imagen}"
                     class="card-img-top"
                     alt="Imagen módulo">

                <div class="card-body">

                    <h5 th:text="${modulo.nombre}"
                        class="card-title">
                    </h5>

                    <p th:text="${modulo.descripcion}"
                       class="card-text">
                    </p>

                    <div class="card-footer text-muted">

                        <a href="#"
                           th:text="${modulo.textoBoton}"
                           class="btn btn-primary">
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

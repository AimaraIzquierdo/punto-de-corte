<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

  <title>Examen oficial</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <style>

    body{
      background:#f8f9fa;
    }

    .contenedor{
      max-width:1000px;
      margin:auto;
      padding:40px 20px;
    }

    .pregunta{
      background:white;
      padding:25px;
      border-radius:16px;
      margin-bottom:20px;
      box-shadow:0 2px 8px rgba(0,0,0,0.06);
    }

  </style>

</head>

<body>

<div class="contenedor">

  <h1 class="fw-bold mb-4">
    Examen oficial
  </h1>

  <div th:if="${error}" class="alert alert-danger">
    <span th:text="${error}"></span>
  </div>

  <form th:action="@{/oficial/corregir}" method="post">

    <input type="hidden" name="categoria" th:value="${categoria}">

    <div th:each="p, stat : ${preguntas}" class="pregunta">

      <h5 class="mb-3"
          th:text="${stat.index + 1} + '. ' + ${p.pregunta}">
      </h5>

      <div class="form-check mb-2">

        <input class="form-check-input"
               type="radio"
               th:name="'p' + ${stat.index}"
               value="1">

        <label class="form-check-label"
               th:text="${p.opcion1}">
        </label>

      </div>

      <div class="form-check mb-2">

        <input class="form-check-input"
               type="radio"
               th:name="'p' + ${stat.index}"
               value="2">

        <label class="form-check-label"
               th:text="${p.opcion2}">
        </label>

      </div>

      <div class="form-check mb-2">

        <input class="form-check-input"
               type="radio"
               th:name="'p' + ${stat.index}"
               value="3">

        <label class="form-check-label"
               th:text="${p.opcion3}">
        </label>

      </div>

      <div class="form-check">

        <input class="form-check-input"
               type="radio"
               th:name="'p' + ${stat.index}"
               value="4">

        <label class="form-check-label"
               th:text="${p.opcion4}">
        </label>

      </div>

    </div>

    <button class="btn btn-primary btn-lg w-100"
            type="submit">

      Finalizar examen

    </button>

  </form>

  <div class="text-center mt-4">

    <a href="/examenesOficiales"
       class="btn btn-secondary">

      Volver a exámenes

    </a>

  </div>

</div>

</body>
</html>

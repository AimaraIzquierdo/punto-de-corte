<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Carrito</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet" crossorigin="anonymous">
    <style>
        .navbar,
        .navbar a,
        .navbar-brand,
        .nav-link {
            color: black !important;
        }

        .navbar a:hover,
        .navbar-brand:hover,
        .nav-link:hover {
            color: black !important;
        }
        body { background: #f8f9fa; }
        .page-wrapper { padding: 20px 30px 40px 30px; }
        h2 { margin: 20px 0; font-weight: 700; }
        .carrito-img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 8px;
        }
        .btn-primary { background: #1976d2; border: none; }
        .btn-primary:hover { background: #145ca1; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg"
     style="background-color: #d9dbde;"
     data-bs-theme="dark">

    <div class="container-fluid">

        <a class="navbar-brand" href="#">
            <img th:src="@{/img/logoAjustado.png}"
                 alt="Logo"
                 class="d-inline-block"
                 style="width: 40px; height: auto;">
            Punto de corte
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse"
             id="navbarSupportedContent">

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link active"
                       th:href="@{/home}">
                        Inicio
                    </a>
                </li>

            </ul>

            <div class="me-3">
                Hola <span th:text="${usuario.nombre}"></span>
            </div>

            <form class="d-flex">
                <input class="form-control me-2"
                       type="search"
                       placeholder="Buscar"/>
                <button class="btn btn-outline-success"
                        type="submit">
                    Buscar
                </button>
            </form>

            <a th:href="@{/perfil}"
               class="btn btn-outline-primary ms-2 me-3"
               th:text="'Perfil de ' + ${usuario.nombre}">
            </a>

            <form th:action="@{/logout}"
                  method="post">
                <button class="btn btn-outline-danger">
                    Cerrar sesión
                </button>
            </form>

        </div>

    </div>

</nav>

<div class="page-wrapper">

    <h2>Tu carrito</h2>

    <!-- Mensaje de éxito - MOSTRAR PRIMERO -->
    <div th:if="${mensaje != null}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
        <strong>✓ Éxito</strong>
        <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Carrito vacío -->
    <div th:if="${#lists.isEmpty(items)}" class="text-center text-muted py-5">
        <p>Tu carrito está vacío.</p>
        <a th:href="@{/tiendaOpositor}" class="btn btn-primary">Ir a la tienda</a>
    </div>

    <!-- Carrito con productos -->
    <div th:if="${!#lists.isEmpty(items)}">
        <div class="card shadow-sm mb-4">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Imagen</th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Precio ud.</th>
                        <th>Cantidad</th>
                        <th>Subtotal</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${items}">
                        <td>
                            <img th:src="${item.producto.urlProduc}"
                                 class="carrito-img"
                                 onerror="this.src='/img/placeholder.png'">
                        </td>
                        <td th:text="${item.producto.nombreProduc}"></td>
                        <td>
                                <span class="badge bg-secondary"
                                      style="text-transform: capitalize;"
                                      th:text="${item.producto.categoria}">
                                </span>
                        </td>
                        <td th:text="${item.producto.precio + ' €'}"></td>
                        <td th:text="${item.cantidad}"></td>
                        <td>
                            <strong th:text="${item.producto.precio * item.cantidad + ' €'}"></strong>
                        </td>
                        <td>
                            <form th:action="@{/carrito/eliminar/{id}(id=${item.idCarrito})}"
                                  method="post">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    Eliminar
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Total y Botón -->
        <div class="d-flex justify-content-between align-items-center gap-3 mt-4">
            <div class="card shadow-sm p-3" style="min-width: 250px;">
                <div class="d-flex justify-content-between align-items-center">
                    <span class="fw-semibold fs-5">Total</span>
                    <strong class="text-primary fs-4" th:text="${total + ' €'}"></strong>
                </div>
            </div>

            <form th:action="@{/carrito/enviar}"
                  method="post">
                <button type="submit" class="btn btn-success px-5 py-2 fs-5">
                    Enviar a la academia
                </button>
            </form>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
</body>
</html>

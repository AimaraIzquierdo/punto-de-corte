<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Examen personalizado</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-5">

    <h1 class="fw-bold mb-2">Examen personalizado</h1>

    <h5 class="text-muted mb-4">
        Crea tus preguntas. Al llegar a 10 se generará el examen automáticamente.
    </h5>

    <!-- CONTADOR -->
    <div class="card shadow-sm p-3 mb-4 text-center">

        <h5 class="fw-bold">Progreso</h5>

        <h2 class="text-primary mb-0">
            <span th:text="${contador}"></span> / 10
        </h2>

    </div>

    <!-- CATEGORÍA -->
    <div class="card shadow-sm p-4 mb-4">

        <h5>Categoría</h5>

        <form th:action="@{/categoria/guardar}" method="post">

            <select class="form-select mb-3" name="idCategoria">

                <option value="" selected disabled>
                    Selecciona categoría
                </option>

                <option th:each="c : ${categorias}"
                        th:value="${c.idCategoria}"
                        th:text="${c.nombre}">
                </option>

            </select>

            <button class="btn btn-primary">
                Fijar categoría
            </button>

        </form>

    </div>

    <!-- PREGUNTA -->
    <div class="card shadow-sm p-4">

        <h5>Añadir pregunta</h5>

        <form th:action="@{/pregunta/guardar}" method="post">

            <input class="form-control mb-2" name="pregunta" placeholder="Pregunta">
            <input class="form-control mb-2" name="opcion1" placeholder="Opción 1">
            <input class="form-control mb-2" name="opcion2" placeholder="Opción 2">
            <input class="form-control mb-2" name="opcion3" placeholder="Opción 3">
            <input class="form-control mb-2" name="opcion4" placeholder="Opción 4">

            <select class="form-select mb-3" name="correcta" required>

                <option value="" selected disabled>
                    Selecciona respuesta correcta
                </option>

                <option value="1">Opción 1</option>
                <option value="2">Opción 2</option>
                <option value="3">Opción 3</option>
                <option value="4">Opción 4</option>

            </select>

            <button class="btn btn-success">
                Añadir pregunta
            </button>

        </form>

    </div>

</div>

</body>
</html>

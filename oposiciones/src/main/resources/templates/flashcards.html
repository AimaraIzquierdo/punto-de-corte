<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Flashcards</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background-color:#f5f5f5;
        }

        .flashcard{
            border-radius:20px;
            padding:20px;
            color:white;
            min-height:220px;
            position:relative;
            transition:0.3s;
        }

        .flashcard:hover{
            transform:scale(1.03);
        }

        .respuesta{
            display:none;
            margin-top:20px;
            font-weight:bold;
        }

        .tema-titulo{
            margin-top:50px;
            margin-bottom:20px;
        }

        .botones-flashcard{
            display:flex;
            gap:10px;
            margin-top:15px;
            flex-wrap:wrap;
        }

    </style>

</head>

<body>

<div class="container mt-5">

    <h1 class="text-center mb-5">
        Flashcards
    </h1>

    <!-- FORMULARIO -->

    <div class="card p-4 shadow">

        <h3 class="mb-4">
            Crear flashcard
        </h3>

        <form id="flashcardForm">

            <div class="mb-3">

                <label class="form-label">
                    Tema
                </label>

                <select class="form-select" id="tema">

                    <option>Guardia Civil</option>

                    <option>Policía Nacional</option>

                    <option>Bomberos</option>

                </select>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Pregunta
                </label>

                <input type="text"
                       class="form-control"
                       id="pregunta">

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Respuesta
                </label>

                <input type="text"
                       class="form-control"
                       id="respuesta">

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Color
                </label>

                <input type="color"
                       class="form-control form-control-color"
                       id="color"
                       value="#0d6efd">

            </div>

            <button type="button"
                    class="btn btn-primary"
                    onclick="crearFlashcard()">

                Crear flashcard

            </button>

        </form>

    </div>

    <!-- TEMAS -->

    <h2 class="tema-titulo">
        Guardia Civil
    </h2>

    <div class="row g-4"
         id="guardiaCivil">

        <!-- EJEMPLO -->

        <div class="col-md-4">

            <div class="flashcard"
                 style="background-color:#0d6efd;">

                <h4>
                    ¿Cuántos temas tiene el temario?
                </h4>

                <div class="botones-flashcard">
                    <button class="btn btn-light btn-sm"
                            onclick="mostrarRespuesta(this)">

                        Ver respuesta

                    </button>

                    <button class="btn btn-danger btn-sm"
                            onclick="eliminarFlashcard(this)">

                        Eliminar

                    </button>
                </div>

                <div class="respuesta">

                    25 temas

                </div>

            </div>

        </div>

    </div>

    <!-- POLICIA -->

    <h2 class="tema-titulo">
        Policía Nacional
    </h2>

    <div class="row g-4"
         id="policia">

    </div>

    <!-- BOMBEROS -->

    <h2 class="tema-titulo">
        Bomberos
    </h2>

    <div class="row g-4"
         id="bomberos">

    </div>

</div>

<script>

    function mostrarRespuesta(boton){

        let respuesta =
            boton.parentElement.parentElement.querySelector(".respuesta");

        if(respuesta.style.display === "block"){

            respuesta.style.display = "none";
            boton.innerText = "Ver respuesta";

        }else{

            respuesta.style.display = "block";
            boton.innerText = "Ocultar respuesta";
        }
    }

    function eliminarFlashcard(boton){
        // Sube dos niveles: button -> botones-flashcard -> flashcard -> col-md-4
        let tarjeta = boton.parentElement.parentElement.parentElement;
        tarjeta.remove();
    }

    function crearFlashcard(){

        let tema =
            document.getElementById("tema").value;

        let pregunta =
            document.getElementById("pregunta").value;

        let respuesta =
            document.getElementById("respuesta").value;

        let color =
            document.getElementById("color").value;

        let contenedor;

        if(tema === "Guardia Civil"){

            contenedor =
                document.getElementById("guardiaCivil");

        }else if(tema === "Policía Nacional"){

            contenedor =
                document.getElementById("policia");

        }else{

            contenedor =
                document.getElementById("bomberos");
        }

        let tarjeta = `

            <div class="col-md-4">

                <div class="flashcard"
                     style="background-color:${color};">

                    <h4>${pregunta}</h4>

                    <div class="botones-flashcard">
                        <button class="btn btn-light btn-sm"
                                onclick="mostrarRespuesta(this)">

                            Ver respuesta

                        </button>

                        <button class="btn btn-danger btn-sm"
                                onclick="eliminarFlashcard(this)">

                            Eliminar

                        </button>
                    </div>

                    <div class="respuesta">

                        ${respuesta}

                    </div>

                </div>

            </div>

        `;

        contenedor.innerHTML += tarjeta;

        document.getElementById("pregunta").value = "";
        document.getElementById("respuesta").value = "";
    }

</script>

</body>
</html>

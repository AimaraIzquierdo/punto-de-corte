<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Flashcards</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .navbar,
        .navbar a,
        .navbar-brand,
        .nav-link {
            color: black !important;
        }

        .navbar a:hover,
        .navbar-brand:hover,
        .nav-link:hover {
            color: black !important;
        }

        body {
            background-color: #f4f5f7;
        }

        .tema {
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 14px;
        }

        .flashcard {
            border-radius: 18px;
            padding: 18px;
            color: white;
            background: #2f2f2f;
        }

        .respuesta {
            display: none;
            margin-top: 10px;
            font-weight: bold;
        }

    </style>
</head>

<body>
<nav class="navbar navbar-expand-lg"
     style="background-color: #d9dbde;"
     data-bs-theme="dark">

    <div class="container-fluid">

        <a class="navbar-brand" href="#">
            <img th:src="@{/img/logoAjustado.png}"
                 alt="Logo"
                 class="d-inline-block"
                 style="width: 40px; height: auto;">
            Punto de corte
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse"
             id="navbarSupportedContent">

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link active"
                       th:href="@{/home}">
                        Inicio
                    </a>
                </li>

            </ul>

            <div class="me-3">
                Hola <span th:text="${usuario.nombre}"></span>
            </div>

            <form class="d-flex" onsubmit="return false;">
                <input class="form-control me-2"
                       type="search"
                       placeholder="Buscar módulo..."
                       id="buscadorModulos"/>
                <button class="btn btn-outline-success"
                        type="submit">
                    Buscar
                </button>
            </form>

            <a th:href="@{/perfil}"
               class="btn btn-outline-primary ms-2 me-3"
               th:text="'Perfil de ' + ${usuario.nombre}">
            </a>

            <form th:action="@{/logout}"
                  method="post">
                <button class="btn btn-outline-danger">
                    Cerrar sesión
                </button>
            </form>

        </div>

    </div>

</nav>

<div class="container mt-4">

    <h1 class="text-center mb-4">Flashcards</h1>

    <!-- CREAR TEMA -->
    <div class="card p-3 mb-4">

        <h5>Crear tema</h5>

        <form th:action="@{/flashcards/tema/crear}" method="post" class="d-flex gap-2">

            <input type="text" name="nombre" class="form-control" placeholder="Nombre del tema">

            <button class="btn btn-dark">Crear</button>

        </form>

    </div>

    <!-- CREAR FLASHCARD -->
    <div class="card p-3 mb-4">

        <h5>Crear flashcard</h5>

        <form th:action="@{/flashcards/guardar}" method="post">

            <select name="idTema" class="form-select mb-2" required>

                <option value="">Selecciona tema</option>

                <option th:each="t : ${temas}"
                        th:value="${t.id}"
                        th:text="${t.nombre}">
                </option>

            </select>

            <input type="text" name="pregunta" class="form-control mb-2" placeholder="Pregunta" required>

            <input type="text" name="respuesta" class="form-control mb-2" placeholder="Respuesta" required>

            <button class="btn btn-dark w-100">Guardar flashcard</button>

        </form>

    </div>

    <!-- LISTADO TEMAS -->
    <div th:each="t : ${temas}" class="tema">

        <div class="d-flex justify-content-between align-items-center">

            <h5 th:text="${t.nombre}"></h5>

            <!-- ELIMINAR TEMA -->
            <form th:action="@{/flashcards/tema/eliminar/{id}(id=${t.id})}"
                  method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}" />

                <button class="btn btn-danger btn-sm">
                    Eliminar tema
                </button>

            </form>

        </div>

        <div class="row mt-3">

            <div th:each="f : ${flashcards}"
                 th:if="${f.tema != null and f.tema.id == t.id}"
                 class="col-md-4 mb-3">

                <div class="flashcard">

                    <div th:text="${f.pregunta}"></div>

                    <button class="btn btn-light btn-sm mt-2"
                            onclick="toggle(this)">
                        Ver respuesta
                    </button>

                    <div class="respuesta" th:text="${f.respuesta}"></div>

                    <!-- ELIMINAR FLASHCARD -->
                    <form th:action="@{/flashcards/eliminar/{id}(id=${f.id_flash})}"
                          method="post"
                          class="mt-2">

                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}" />

                        <button class="btn btn-danger btn-sm">
                            Eliminar
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script>
    function toggle(btn) {
        let resp = btn.nextElementSibling;
        resp.style.display = resp.style.display === "block" ? "none" : "block";
    }
</script>

</body>
</html>

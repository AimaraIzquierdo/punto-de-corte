<!DOCTYPE html>
<html>
<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/locales/es.global.min.js"></script>

    <style>
        body { background: #f8f9fa; }
        .page-wrapper { padding: 20px; }

        .fc {
            background: white;
            padding: 15px;
            border-radius: 12px;
        }

        #modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        #modal-content {
            background: white;
            width: 360px;
            padding: 20px;
            border-radius: 12px;
        }
    </style>

</head>

<body>

<div class="page-wrapper">

    <h2>Calendario</h2>

    <div id="calendar"></div>

</div>

<!-- MODAL -->
<div id="modal">
    <div id="modal-content">

        <h4>Nuevo evento</h4>

        <input id="titulo" class="form-control mb-2" placeholder="Título">
        <input id="hora" type="time" class="form-control mb-2">
        <textarea id="descripcion" class="form-control mb-2" placeholder="Descripción"></textarea>

        <button class="btn btn-primary w-100" onclick="guardarEvento()">
            Guardar
        </button>

        <button class="btn btn-secondary w-100 mt-2" onclick="cerrarModal()">
            Cancelar
        </button>

    </div>
</div>

<script>

    let calendar;
    let selectedDate = null;

    /* ================= MODAL ================= */

    function abrirModal(dateStr) {
        selectedDate = dateStr;
        document.getElementById("modal").style.display = "flex";
    }

    function cerrarModal() {
        document.getElementById("modal").style.display = "none";

        document.getElementById("titulo").value = "";
        document.getElementById("hora").value = "";
        document.getElementById("descripcion").value = "";
    }

    /* ================= GUARDAR ================= */

    function guardarEvento() {

        let titulo = document.getElementById("titulo").value;
        let hora = document.getElementById("hora").value;
        let descripcion = document.getElementById("descripcion").value;

        if (!titulo || !hora) {
            alert("Completa título y hora");
            return;
        }

        let start = selectedDate + "T" + hora;

        fetch('/calendario', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                title: titulo,
                start: start,
                end: start,
                description: descripcion
            })
        })
            .then(async res => {

                const text = await res.text();

                console.log("STATUS:", res.status);
                console.log("RESPUESTA:", text);

                if (!res.ok) {
                    throw new Error(text);
                }

                return JSON.parse(text);
            })
            .then(data => {

                console.log("Guardado OK:", data);

                calendar.refetchEvents();

                cerrarModal();
            })
            .catch(err => {
                console.error("ERROR:", err);
                alert("Error al guardar: " + err.message);
            });
    }

    /* ================= CALENDARIO ================= */

    document.addEventListener('DOMContentLoaded', function () {

        calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {

            locale: 'es',
            initialView: 'dayGridMonth',
            firstDay: 1,

            events: '/calendario/eventos',

            dateClick: function(info) {
                abrirModal(info.dateStr);
            }
        });

        calendar.render();
    });

</script>

</body>
</html>

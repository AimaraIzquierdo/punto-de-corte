<!DOCTYPE html>
<html>
<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/locales/es.global.min.js"></script>

    <style>
        .navbar,
        .navbar a,
        .navbar-brand,
        .nav-link {
            color: black !important;
        }

        .navbar a:hover,
        .navbar-brand:hover,
        .nav-link:hover {
            color: black !important;
        }

        body {
            background: #f8f9fa;
        }

        .page-wrapper {
            padding: 20px;
        }

        .fc {
            background: white;
            padding: 15px;
            border-radius: 12px;
        }

        /* ================= MES CALENDARIO ================= */

        .fc-toolbar-title {

            color: #0d6efd;

            font-size: 28px;

            font-weight: 700;

            text-align: center;

            width: 100%;
        }

        /* CENTRAR MES */

        .fc .fc-toolbar {

            position: relative;

            justify-content: center;
        }

        .fc .fc-toolbar-chunk:first-child {

            position: absolute;

            left: 0;
        }

        .fc .fc-toolbar-chunk:last-child {

            position: absolute;

            right: 0;
        }

        /* ================= MODALES ================= */

        #modal,
        #modal-info {

            display: none;

            position: fixed;

            inset: 0;

            background: rgba(0,0,0,0.5);

            justify-content: center;

            align-items: center;

            z-index: 9999;
        }

        #modal-content,
        #modal-info-content {

            background: white;

            width: 550px;

            max-width: 95%;

            padding: 25px;

            border-radius: 12px;
        }

        /* ================= DESCRIPCION ================= */

        .descripcion-box {

            background: #f5f5f5;

            padding: 12px;

            border-radius: 8px;

            min-height: 120px;

            white-space: pre-wrap;
        }

    </style>

</head>

<body>
<nav class="navbar navbar-expand-lg"
     style="background-color: #d9dbde;"
     data-bs-theme="dark">

    <div class="container-fluid">

        <a class="navbar-brand" href="#">
            <img th:src="@{/img/logoAjustado.png}"
                 alt="Logo"
                 class="d-inline-block"
                 style="width: 40px; height: auto;">
            Punto de corte
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse"
             id="navbarSupportedContent">

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link active"
                       th:href="@{/home}">
                        Inicio
                    </a>
                </li>

            </ul>

            <div class="me-3">
                Hola <span th:text="${usuario.nombre}"></span>
            </div>

            <form class="d-flex">
                <input class="form-control me-2"
                       type="search"
                       placeholder="Buscar"/>
                <button class="btn btn-outline-success"
                        type="submit">
                    Buscar
                </button>
            </form>

            <a th:href="@{/perfil}"
               class="btn btn-outline-primary ms-2 me-3"
               th:text="'Perfil de ' + ${usuario.nombre}">
            </a>

            <form th:action="@{/logout}"
                  method="post">
                <button class="btn btn-outline-danger">
                    Cerrar sesión
                </button>
            </form>

        </div>

    </div>

</nav>

<div class="page-wrapper">

    <h2 class="mb-4">Calendario</h2>

    <div id="calendar"></div>

</div>

<!-- ================= MODAL CREAR ================= -->

<div id="modal">

    <div id="modal-content">

        <h4>Nuevo evento</h4>

        <input
                id="titulo"
                class="form-control mb-2"
                placeholder="Título"
        >

        <input
                id="hora"
                type="time"
                class="form-control mb-2"
        >

        <textarea
                id="descripcion"
                class="form-control mb-3"
                rows="6"
                placeholder="Descripción"
        ></textarea>

        <button
                class="btn btn-primary w-100"
                onclick="guardarEvento()">
            Guardar
        </button>

        <button
                class="btn btn-secondary w-100 mt-2"
                onclick="cerrarModal()">
            Cancelar
        </button>

    </div>

</div>

<!-- ================= MODAL INFO ================= -->

<div id="modal-info">

    <div id="modal-info-content">

        <h3 id="info-titulo"></h3>

        <p class="mt-3">
            <strong>Fecha:</strong>
            <span id="info-fecha"></span>
        </p>

        <div
                class="descripcion-box mt-3"
                id="info-descripcion">
        </div>

        <button
                class="btn btn-danger w-100 mt-4"
                onclick="eliminarEvento()">
            Eliminar evento
        </button>

        <button
                class="btn btn-secondary w-100 mt-2"
                onclick="cerrarModalInfo()">
            Cerrar
        </button>

    </div>

</div>

<script>

    let calendar;
    let selectedDate = null;
    let selectedEventId = null;

    /* ================= MODAL CREAR ================= */

    function abrirModal(dateStr) {

        selectedDate = dateStr;

        document.getElementById("modal").style.display = "flex";
    }

    function cerrarModal() {

        document.getElementById("modal").style.display = "none";

        document.getElementById("titulo").value = "";

        document.getElementById("hora").value = "";

        document.getElementById("descripcion").value = "";
    }

    /* ================= MODAL INFO ================= */

    function abrirModalInfo(event) {

        selectedEventId = event.id;

        document.getElementById("info-titulo").innerText =
            event.title;

        document.getElementById("info-fecha").innerText =
            event.start.toLocaleString();

        document.getElementById("info-descripcion").innerText =
            event.extendedProps.description || "Sin descripción";

        document.getElementById("modal-info").style.display = "flex";
    }

    function cerrarModalInfo() {

        document.getElementById("modal-info").style.display = "none";
    }

    /* ================= GUARDAR ================= */

    function guardarEvento() {

        let titulo =
            document.getElementById("titulo").value;

        let hora =
            document.getElementById("hora").value;

        let descripcion =
            document.getElementById("descripcion").value;

        if (!titulo || !hora) {

            alert("Completa título y hora");

            return;
        }

        let start = selectedDate + "T" + hora;

        fetch('/calendario', {

            method: 'POST',

            headers: {
                'Content-Type': 'application/json'
            },

            body: JSON.stringify({

                title: titulo,

                start: start,

                end: start,

                description: descripcion
            })
        })
            .then(res => {

                if (!res.ok) {
                    throw new Error("Error guardando");
                }

                return res.json();
            })
            .then(() => {

                calendar.refetchEvents();

                cerrarModal();
            })
            .catch(err => {

                console.error(err);

                alert("Error al guardar");
            });
    }

    /* ================= ELIMINAR ================= */

    function eliminarEvento() {

        fetch('/calendario/' + selectedEventId, {

            method: 'DELETE'

        })
            .then(res => {

                if (!res.ok) {
                    throw new Error("Error eliminando");
                }

                calendar.refetchEvents();

                cerrarModalInfo();
            })
            .catch(err => {

                console.error(err);

                alert("Error eliminando");
            });
    }

    /* ================= CALENDARIO ================= */

    document.addEventListener('DOMContentLoaded', function () {

        calendar = new FullCalendar.Calendar(

            document.getElementById('calendar'),

            {

                locale: 'es',

                initialView: 'dayGridMonth',

                firstDay: 1,

                events: '/calendario/eventos',

                dateClick: function(info) {

                    abrirModal(info.dateStr);
                },

                eventClick: function(info) {

                    abrirModalInfo(info.event);
                }
            }
        );

        calendar.render();
    });

</script>

</body>
</html>

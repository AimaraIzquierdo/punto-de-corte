<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registro</title>
</head>
<body>

<h2>Crear cuenta</h2>

<form th:action="@{/registro}"
      th:object="${usuario}"
      method="post">

    <input type="text"
           th:field="*{nombre}"
           placeholder="Nombre">

    <br><br>

    <input type="text"
           th:field="*{apellidos}"
           placeholder="Apellidos">

    <br><br>

    <input type="email"
           th:field="*{email}"
           placeholder="Email">

    <br><br>

    <input type="password"
           th:field="*{password}"
           placeholder="Contraseña">

    <br><br>

    <button type="submit">
        Registrarse
    </button>

</form>

</body>
</html>

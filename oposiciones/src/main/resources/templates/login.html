<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary">

    <div class="container-fluid">

        <a class="navbar-brand" href="#">
            <img src="img/favicon_escudo.svg"
                 alt="Logo"
                 class="d-inline-block"
                 style="width: 40px; height: auto;">

            Punto de corte
        </a>
    </div>
</nav>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-4">

            <div class="card">

                <div class="card-header">
                    Iniciar sesión
                </div>

                <div class="card-body">

                    <form method="post"
                          th:action="@{/login}">

                        <div class="mb-3">

                            <label>Email</label>

                            <input type="text"
                                   name="username"
                                   class="form-control">

                        </div>

                        <div class="mb-3">

                            <label>Contraseña</label>

                            <input type="password"
                                   name="password"
                                   class="form-control">

                        </div>

                        <button type="submit"
                                class="btn btn-primary w-100">

                            Entrar

                        </button>

                        <hr>

                        <a th:href="@{/registro}">
                            Crear cuenta
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>

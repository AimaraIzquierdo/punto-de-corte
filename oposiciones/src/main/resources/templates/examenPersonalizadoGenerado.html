<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Examen personalizado</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-5">

    <h1 class="fw-bold mb-2">Examen personalizado</h1>

    <h5 class="text-muted mb-4">
        Responde todas las preguntas antes de finalizar.
    </h5>

    <div th:if="${error}" class="alert alert-danger">
        <span th:text="${error}"></span>
    </div>

    <form th:action="@{/personalizado/corregir}" method="post">

        <div th:each="p : ${examen}" class="card shadow-sm p-4 mb-3">

            <h5 th:text="${p.pregunta}"></h5>

            <div class="form-check">
                <input type="radio" class="form-check-input"
                       th:name="'p' + ${p.idPregunta}" value="1">
                <label th:text="${p.opcion1}"></label>
            </div>

            <div class="form-check">
                <input type="radio" class="form-check-input"
                       th:name="'p' + ${p.idPregunta}" value="2">
                <label th:text="${p.opcion2}"></label>
            </div>

            <div class="form-check">
                <input type="radio" class="form-check-input"
                       th:name="'p' + ${p.idPregunta}" value="3">
                <label th:text="${p.opcion3}"></label>
            </div>

            <div class="form-check">
                <input type="radio" class="form-check-input"
                       th:name="'p' + ${p.idPregunta}" value="4">
                <label th:text="${p.opcion4}"></label>
            </div>

        </div>

        <button class="btn btn-primary btn-lg">
            Finalizar examen
        </button>

    </form>

    <a href="/simuladorExamen" class="btn btn-secondary mt-3">
        Volver
    </a>

</div>

</body>
</html>

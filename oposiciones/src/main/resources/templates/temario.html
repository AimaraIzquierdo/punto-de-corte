<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Temario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .contenedor-principal{
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
        }

        h1{
            font-size: 32px;
            margin-bottom: 35px;
            color: #222;
        }

        .subida{
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 40px;
            border: 1px solid #ddd;
        }

        .subida form{
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        input[type="file"],
        select{
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: white;
        }

        button{
            background: #1f4e79;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover{
            background: #163a5a;
        }

        .titulo-seccion{
            margin-top: 50px;
            margin-bottom: 25px;
            padding-left: 12px;
            border-left: 5px solid #1f4e79;
        }

        .titulo-seccion h2{
            margin: 0;
            font-size: 24px;
            color: #222;
        }

        .contenedor-archivos{
            display: grid;
            grid-template-columns: repeat(auto-fill,minmax(280px,1fr));
            gap: 20px;
        }

        .archivo-card{
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 18px;
        }

        .nombre-archivo{
            font-weight: bold;
            color: #222;
            margin-bottom: 20px;
            word-break: break-word;
        }

        .acciones{
            display: flex;
            justify-content: space-between;
        }

        .acciones a{
            text-decoration: none;
            color: #1f4e79;
            font-weight: bold;
            font-size: 14px;
        }

        .acciones a:hover{
            text-decoration: underline;
        }

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg"
     style="background-color: #d9dbde;"
     data-bs-theme="dark">

    <div class="container-fluid">

        <a class="navbar-brand" href="#">
            <img src="img/logoAjustado.png"
                 alt="Logo"
                 class="d-inline-block"
                 style="width: 40px; height: auto;">
            Punto de corte
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse"
             id="navbarSupportedContent">

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link active"
                       th:href="@{/home}">
                        Inicio
                    </a>
                </li>

            </ul>

            <div class="me-3">
                Hola <span th:text="${usuario.nombre}"></span>
            </div>

            <form class="d-flex">
                <input class="form-control me-2"
                       type="search"
                       placeholder="Buscar"/>
                <button class="btn btn-outline-success"
                        type="submit">
                    Buscar
                </button>
            </form>

            <a th:href="@{/perfil}"
               class="btn btn-outline-primary ms-2 me-3"
               th:text="'Perfil de ' + ${usuario.nombre}">
            </a>

            <form th:action="@{/logout}"
                  method="post">
                <button class="btn btn-outline-danger">
                    Cerrar sesión
                </button>
            </form>

        </div>

    </div>

</nav>

<div class="contenedor-principal">

    <h1>Temarios</h1>

    <div class="subida">

        <form action="/subir-temario"
              method="post"
              enctype="multipart/form-data">

            <input type="file"
                   name="file"
                   required>

            <select name="oposicion" required>

                <option value="">
                    Selecciona oposición
                </option>

                <option value="Bomberos">
                    Bomberos
                </option>

                <option value="Guardia Civil">
                    Guardia Civil
                </option>

            </select>

            <button type="submit">
                Subir archivo
            </button>

        </form>

    </div>

    <!-- BOMBEROS -->

    <div class="titulo-seccion">
        <h2>Bomberos</h2>
    </div>

    <div class="contenedor-archivos">

        <div class="archivo-card"
             th:each="archivo : ${archivos}"
             th:if="${archivo.oposicion == 'Bomberos'}">

            <div class="nombre-archivo"
                 th:text="${archivo.nombre}">
            </div>

            <div class="acciones">

                <a th:href="@{/ver-temario/{id}(id=${archivo.id})}">
                    Ver
                </a>

                <a th:href="@{/eliminar-temario/{id}(id=${archivo.id})}">
                    Eliminar
                </a>

            </div>

        </div>

    </div>

    <!-- GUARDIA CIVIL -->

    <div class="titulo-seccion">
        <h2>Guardia Civil</h2>
    </div>

    <div class="contenedor-archivos">

        <div class="archivo-card"
             th:each="archivo : ${archivos}"
             th:if="${archivo.oposicion == 'Guardia Civil'}">

            <div class="nombre-archivo"
                 th:text="${archivo.nombre}">
            </div>

            <div class="acciones">

                <a th:href="@{/ver-temario/{id}(id=${archivo.id})}">
                    Ver
                </a>

                <a th:href="@{/eliminar-temario/{id}(id=${archivo.id})}">
                    Eliminar
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>

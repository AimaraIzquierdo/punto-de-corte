<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Videos recomendados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">
            <img src="/img/favicon_escudo.svg" alt="Logo" class="d-inline-block" style="width: 40px; height: auto;">
            Punto de corte
        </a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="/">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="/videos">Videos</a>
                </li>
            </ul>
            <form class="d-flex" role="search">
                <input class="form-control me-2" type="search" placeholder="Buscar" aria-label="Search"/>
                <button class="btn btn-outline-success" type="submit">Buscar</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="text-center mb-4 fs-4">Videos recomendados</h2>

    <div class="card shadow-sm p-4 mb-5">
        <h4 class="mb-3">Añadir nuevo video</h4>
        <form th:action="@{/videos}" th:object="${nuevoVideo}" method="post">
            <div class="mb-3">
                <label class="form-label">Título del video</label>
                <input type="text" th:field="*{titulo}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">URL de YouTube</label>
                <input type="text" th:field="*{url}" class="form-control"
                       placeholder="https://www.youtube.com/watch?v=..." required>
            </div>
            <button type="submit" class="btn btn-success">Subir video</button>
        </form>
    </div>

    <div class="row">
        <div th:each="video, iterStat : ${videos}" class="col-md-6 mb-4">
            <div class="card shadow-sm h-100">
                <div class="ratio ratio-16x9">
                    <iframe th:src="${video.url}" allowfullscreen></iframe>
                </div>
                <div class="card-body">
                    <h5 th:text="${video.titulo}" class="card-title"></h5>
                    <a th:href="@{/eliminar-video/{id}(id=${iterStat.index})}"
                       class="btn btn-danger btn-sm mt-2">
                        Eliminar video
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center mt-4 mb-5">
        <a href="/" class="btn btn-secondary">Volver al inicio</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

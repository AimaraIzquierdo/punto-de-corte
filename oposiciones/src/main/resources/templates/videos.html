<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <title>Videos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary">

    <div class="container-fluid">

        <a class="navbar-brand" href="#">
            <img src="img/favicon_escudo.svg"
                 alt="Logo"
                 class="d-inline-block"
                 style="width: 40px; height: auto;">

            Punto de corte
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link active"
                       aria-current="page"
                       th:href="@{/}">
                        Inicio
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        Videos
                    </a>
                </li>

            </ul>

            <form class="d-flex" role="search">

                <input class="form-control me-2"
                       type="search"
                       placeholder="Buscar"
                       aria-label="Search"/>

                <button class="btn btn-outline-success" type="submit">
                    Buscar
                </button>

            </form>

        </div>

    </div>

</nav>

<div class="container mt-5">

    <h2 class="mb-4">Videos</h2>

    <!-- ================= FORMULARIO ================= -->

    <form th:action="@{/videos}"
          method="post"
          th:object="${nuevoVideo}"
          class="mb-5">

        <div class="mb-3">

            <label class="form-label">Título</label>

            <input type="text"
                   class="form-control"
                   th:field="*{titulo}">
        </div>

        <div class="mb-3">

            <label class="form-label">URL YouTube</label>

            <input type="text"
                   class="form-control"
                   th:field="*{url}">
        </div>

        <button class="btn btn-primary">
            Añadir vídeo
        </button>

    </form>

    <!-- ================= LISTA VIDEOS ================= -->

    <div class="row g-4">

        <div class="col-md-4"
             th:each="video, stat : ${videos}">

            <div class="card h-100">

                <iframe th:src="${video.url}"
                        width="100%"
                        height="220"
                        allowfullscreen>
                </iframe>

                <div class="card-body">

                    <h5 class="card-title"
                        th:text="${video.titulo}">
                    </h5>

                    <!-- BOTÓN ELIMINAR -->

                    <form th:action="@{'/videos/eliminar/' + ${stat.index}}"
                          method="post">

                        <button type="submit"
                                class="btn btn-outline-danger btn-sm">
                            Eliminar
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
